model:
  name: RAIQ-200M-v1-T4-smoke-v2
  vocab_size: 32768
  max_seq_len: 2048
  n_layers: 20
  d_model: 768
  n_heads: 12
  n_kv_heads: 12
  d_ff: 2560
  dropout: 0.0
  rope_theta: 10000.0
  tie_embeddings: true
  gradient_checkpointing: true

training:
  seed: 20260817
  device: cuda
  dtype: float16
  batch_size: 1
  grad_accumulation_steps: 32
  max_steps: 5000
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 250
  weight_decay: 0.1
  grad_clip_norm: 1.0
  eval_interval: 4
  save_interval: 4
  log_interval: 1
  finite_diagnostics: true

data:
  dataset_name: raiq-local-code
  dataset_version: local-inspection-v1
  train_path: /content/drive/MyDrive/Raiq/datasets/technical_toy_train.txt
  validation_path: /content/drive/MyDrive/Raiq/datasets/technical_toy_validation.txt
  tokenizer_name: raiq-bpe
  tokenizer_version: colab-trained-v1
  tokenizer_path: /content/drive/MyDrive/Raiq/tokenizer/raiq_code_bpe.json
  corpus_manifest_path: /content/drive/MyDrive/Raiq/manifests/technical_smoke_v1.json
