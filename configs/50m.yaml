model:
  name: RAIQ-50M
  vocab_size: 32768
  max_seq_len: 2048
  n_layers: 16
  d_model: 512
  n_heads: 8
  n_kv_heads: 8
  d_ff: 1360
  dropout: 0.0
  rope_theta: 10000.0
  tie_embeddings: true
  gradient_checkpointing: true

training:
  seed: 1337
  device: cuda
  dtype: bfloat16
  batch_size: 8
  grad_accumulation_steps: 16
  max_steps: 200000
  learning_rate: 0.00025
  min_learning_rate: 0.000025
  warmup_steps: 2000
  weight_decay: 0.1
  grad_clip_norm: 1.0
  eval_interval: 1000
  save_interval: 2000
  log_interval: 20

data:
  dataset_name: raiq-technical-mix
  dataset_version: unassigned
  tokenizer_name: raiq-technical-bpe
  tokenizer_version: unassigned
