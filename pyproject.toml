[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "raiq-core"
version = "0.1.0"
description = "Transparent, from-scratch decoder-only Transformer foundation for RAIQ."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
  {name = "RAIQ Contributors"}
]
dependencies = [
  "torch>=2.3,<2.7",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
raiq-train = "raiq.training.train:main"
raiq-generate = "raiq.inference.generate:main"

[tool.setuptools.packages.find]
include = ["raiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
